name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .m2repo
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
      - run: mvn -B clean verify
