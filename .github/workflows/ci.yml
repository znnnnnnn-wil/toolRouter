name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .m2repo
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      - name: Build and test
        run: mvn -B -ntp clean install
      - name: Run offline example
        run: mvn -B -ntp -f tool-router-tooling/pom.xml exec:java "-Dexec.mainClass=io.github.toolrouter.Example"
      - name: Run benchmark from tooling directory
        working-directory: tool-router-tooling
        run: mvn -B -ntp -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2repo" exec:java "-Dexec.mainClass=io.github.toolrouter.Benchmark"
      - name: Verify external consumer
        working-directory: integration/consumer
        run: mvn -B -ntp -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2repo" verify
      - name: Check published JAR contents
        run: |
          if jar tf tool-router/target/tool-router-0.1.0.jar | grep -Eq 'io/github/toolrouter/(Example|Benchmark|BenchmarkEmbeddingCache)\.class$'; then
            echo "Development utilities must not be packaged in the library JAR"
            exit 1
          fi
